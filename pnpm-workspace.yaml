# Transitive dependencies of the Pi SDK (dev only); heydb does not need their install scripts.
allowBuilds:
  "@google/genai": false
  protobufjs: false

# Supply chain: install no version published less than 3 days ago (minutes).
# Set explicitly, so it is strict: install fails instead of falling back to a
# younger version. The lockfile is checked against it too.
minimumReleaseAge: 4320
