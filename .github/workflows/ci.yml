name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pull requests from forks run here too: the token is read-only and no secret
# is available, so contributor code cannot write to the repository.
permissions:
  contents: read

# A new push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
        include:
          - os: ubuntu-latest
            node: "22.19.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm check

  # Engine queries only prove themselves against real servers (MySQL 8.0,
  # MariaDB 10.6, PostgreSQL 16 with the legacy fixtures). Linux only: the
  # runner has Docker, and the engines behave the same on every client OS.
  integration:
    name: integration (real databases)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start databases
        run: node --run db:up

      - name: Integration tests
        run: node --run test:integration

      - name: Database logs on failure
        if: failure()
        run: docker compose -f tests/integration/compose.yaml logs --tail=100

      - name: Stop databases
        if: always()
        run: node --run db:down
