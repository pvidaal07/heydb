name: Publish

# Pushing a tag vX.Y.Z (or vX.Y.Z-beta.N) that matches package.json publishes
# the package to npm and creates the GitHub release. Prereleases are published
# under the "beta" dist-tag until a stable version exists.
#
# npm authentication: configure trusted publishing for this repository and
# workflow on npmjs.com (no secret needed), or add an NPM_TOKEN secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm check

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # Already published (for example a first release made by hand): only the GitHub release is left.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; skipping publish"
            exit 0
          fi
          tag="latest"
          case "${version}" in *-*) tag="beta" ;; esac
          # The first publish has no "latest" yet; npm needs one, so a first
          # prerelease is published as latest too.
          if ! npm view "${name}" version >/dev/null 2>&1; then tag="latest"; fi
          npm publish --provenance --access public --tag "${tag}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "heydb ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md ${prerelease}
