name: Publish

# Pushing a tag vX.Y.Z (or vX.Y.Z-beta.N) that matches package.json publishes
# the package to npm and creates the GitHub release. Only maintainers can push
# v* tags (the "release-tags" ruleset).
#
# Two jobs on purpose: dependencies are installed and tests run in a job with a
# read-only token. The publish job installs nothing; it packs the checked-out
# files and runs in the "npm" environment, which only v* tags may use.
#
# npm authentication: trusted publishing for this repository, workflow
# publish.yml and environment npm (configured on npmjs.com; no secret).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm check

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # No dependency install here: the package ships its own sources and
      # nothing third-party runs with this job's permissions.
      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # Already published (for example a first release made by hand): only the GitHub release is left.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; skipping publish"
            exit 0
          fi
          tag="latest"
          case "${version}" in *-*) tag="beta" ;; esac
          # The first publish has no "latest" yet; npm needs one, so a first
          # prerelease is published as latest too.
          if ! npm view "${name}" version >/dev/null 2>&1; then tag="latest"; fi
          npm publish --provenance --access public --tag "${tag}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "heydb ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md ${prerelease}
