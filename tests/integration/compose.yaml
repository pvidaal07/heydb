# Real database servers for the integration tests (tests/integration/*.integration.ts).
#   docker compose -f tests/integration/compose.yaml up -d --wait
#   node --run test:integration
#   docker compose -f tests/integration/compose.yaml down
# Data lives in tmpfs: every `up` after a `down` starts from the fixtures again.
# Test-only credentials; never reuse them anywhere else.
name: heydb-it

services:
  mysql80:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: heydb-test
    ports: ["127.0.0.1:33080:3306"]
    tmpfs: [/var/lib/mysql]
    volumes: ["./fixtures/legacy.sql:/docker-entrypoint-initdb.d/legacy.sql:ro"]
    healthcheck:
      test: ["CMD", "mysql", "-uheydb_reader", "-preader-pass", "-h127.0.0.1", "-e", "SELECT 1 FROM shop.orders LIMIT 1"]
      interval: 2s
      retries: 60

  mariadb106:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: heydb-test
    ports: ["127.0.0.1:33106:3306"]
    tmpfs: [/var/lib/mysql]
    volumes: ["./fixtures/legacy.sql:/docker-entrypoint-initdb.d/legacy.sql:ro"]
    healthcheck:
      test: ["CMD", "mysql", "-uheydb_reader", "-preader-pass", "-h127.0.0.1", "-e", "SELECT 1 FROM shop.orders LIMIT 1"]
      interval: 2s
      retries: 60

  # The init script runs against a server that only listens on its Unix
  # socket, so a TCP query as the reader succeeds only once the fixture is
  # loaded and the real server is up.
  postgres16:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: heydb-test
      POSTGRES_DB: legacy
    ports: ["127.0.0.1:33116:5432"]
    tmpfs: [/var/lib/postgresql/data]
    volumes: ["./fixtures/legacy-postgres.sql:/docker-entrypoint-initdb.d/legacy-postgres.sql:ro"]
    healthcheck:
      test: ["CMD", "psql", "postgresql://heydb_reader:reader-pass@127.0.0.1:5432/legacy", "-c", "SELECT 1 FROM public.orders LIMIT 1"]
      interval: 2s
      retries: 60
